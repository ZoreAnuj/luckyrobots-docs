site_name: Lucky Engine Docs
site_description: Documentation for Lucky Engine — the robotics simulation and training platform. Includes the C# scripting guides and API reference.
site_author: Lucky Robots
site_url: https://docs.luckyrobots.com

docs_dir: docs
# site/ is the build output (gitignored).

# Treat broken internal links and anchors as warnings so `mkdocs build --strict` (used in CI) catches them.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  links:
    anchors: warn

theme:
  name: material
  custom_dir: overrides  # adds <link rel=preload> for the brand fonts + inlines the brand logo (overrides/partials/logo.html)
  favicon: assets/favicon.svg
  language: en
  font: false            # use the brand fonts defined in extra.css, not Google's Roboto
  features:
    - navigation.tabs          # top-level sections become tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes       # a folder's index.md is its section landing page
    - navigation.top           # back-to-top button
    - navigation.footer
    - navigation.instant       # XHR page swaps instead of full reloads — loaded fonts persist (kills per-nav FOUT)
    - navigation.instant.progress
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy        # copy button on code blocks
    - content.code.annotate
    - toc.follow               # right-hand member list follows scroll
  palette:
    scheme: slate        # dark only — no light/dark toggle
    primary: custom
    accent: indigo

plugins:
  - search
  - awesome-pages   # builds nav from the docs/ tree + .pages files (so the generated API tree needs no hand-maintained nav)

extra:
  homepage: https://luckyrobots.com   # clicking the header logo returns to the main site
  version:
    provider: mike    # renders the version selector from versions.json on the gh-pages branch
    default: stable   # the alias `/` redirects to (see .github/versions.json); mike set-default keeps it in sync

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition          # !!! note / warning (used for Obsolete callouts)
  - attr_list           # {#explicit-anchor} ids on member headings + cross-references
  - md_in_html          # <code> cells inside tables
  - tables
  - footnotes
  - def_list           # definition lists
  - toc:
      permalink: true
      permalink_title: Link to this section
      toc_depth: 3       # include ### member headings in the on-page table of contents
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid          # ```mermaid diagrams (Material auto-loads mermaid.js)
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.betterem            # robust **bold** / *italic* parsing
  - pymdownx.caret               # ^^insert^^ and ^superscript^
  - pymdownx.mark                # ==highlight==
  - pymdownx.tilde               # ~~strikethrough~~ and ~subscript~
  - pymdownx.keys                # ++ctrl+alt+del++ keyboard keys
  - pymdownx.critic              # {++added++} {--removed--} {~~a~>b~~} {==marked==} {>>note<<}
  - pymdownx.tasklist:
      custom_checkbox: true      # - [x] task lists with themed checkboxes
  - pymdownx.details
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
