name: Docs

# Versioned docs pipeline.
#
#   PR / push to any non-release branch  -> strict build only (no publish, no deploy).
#   push to release/<version>            -> publish that version with mike + deploy live.
#   workflow_dispatch (version input)    -> manually (re)publish a version (e.g. to fix an old one).
#
# Each maintained version lives on its own long-lived branch `release/<version>` and owns one
# slot on the gh-pages branch. mike merges versions onto gh-pages; CI then exports gh-pages and
# uploads the whole tree to the Cloudflare Worker. The C# API reference under docs/scripting/api/
# is committed (devs run tools/ApiDocGen locally), so CI needs only Python + mike + wrangler.

on:
  push:
    branches: ["release/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to (re)publish, e.g. 2026.1 (must exist in .github/versions.json)"
        required: true

permissions:
  contents: write # mike pushes the gh-pages branch

# Serialize deploys: multiple release branches publishing at once would race on gh-pages.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Build (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Strict build (fails on broken links/anchors)
        run: mkdocs build --strict

  deploy:
    name: Publish & deploy
    needs: validate
    # Only on release-branch pushes and manual dispatch — never on PRs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0 # full history so mike can update gh-pages

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Resolve version / alias / title from .github/versions.json
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#release/}"
          fi
          CONF=".github/versions.json"
          if ! jq -e --arg v "$VERSION" 'has($v)' "$CONF" >/dev/null; then
            echo "::error::Version '$VERSION' is not defined in $CONF"; exit 1
          fi
          {
            echo "version=$VERSION"
            echo "alias=$(jq -r --arg v "$VERSION" '.[$v].alias' "$CONF")"
            echo "title=$(jq -r --arg v "$VERSION" '.[$v].title' "$CONF")"
            echo "default=$(jq -r --arg v "$VERSION" '.[$v].default' "$CONF")"
          } >> "$GITHUB_OUTPUT"

      - name: Configure git for mike
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch existing gh-pages (so we merge versions, not overwrite)
        run: git fetch origin gh-pages || echo "gh-pages does not exist yet — first publish"

      - name: Publish this version with mike
        run: |
          set -euo pipefail
          mike deploy --push --update-aliases \
            --title "${{ steps.ver.outputs.title }}" \
            "${{ steps.ver.outputs.version }}" "${{ steps.ver.outputs.alias }}"
          if [ "${{ steps.ver.outputs.default }}" = "true" ]; then
            mike set-default --push "${{ steps.ver.outputs.alias }}"
          fi

      - name: Export gh-pages tree for Cloudflare
        run: |
          set -euo pipefail
          rm -rf _site && mkdir _site
          git archive gh-pages | tar -x -C _site

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.45.2"
          command: deploy
