name: Docs

on:
  # Validate the build on every push / PR to main (no deploy).
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Publish a version on demand.
  workflow_dispatch:
    inputs:
      version:
        description: "Version label to publish (e.g. 2026.1)"
        required: true
      alias:
        description: 'Alias for this version (e.g. "latest")'
        required: false
        default: latest
      engine_ref:
        description: "LuckyEngine branch/tag to generate from"
        required: false
        default: mujoco

permissions:
  contents: write   # mike needs to push the gh-pages branch

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so mike can update gh-pages

      - name: Checkout engine source (API source of truth)
        uses: actions/checkout@v4
        with:
          repository: luckyrobots/LuckyEngine
          ref: ${{ github.event.inputs.engine_ref || 'mujoco' }}
          path: engine-src
          # If LuckyEngine is private, add a PAT with read access as the ENGINE_REPO_TOKEN secret.
          token: ${{ secrets.ENGINE_REPO_TOKEN || github.token }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Generate API reference Markdown
        run: >
          dotnet run --project tools/ApiDocGen -c Release --
          --root . --source engine-src/Hazel-ScriptCore/Source

      - name: Build site (strict — fails on broken links/anchors)
        run: mkdocs build --strict

      - name: Configure git for mike
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Publish version with mike
        if: github.event_name == 'workflow_dispatch'
        run: |
          mike deploy --push --update-aliases \
            "${{ github.event.inputs.version }}" "${{ github.event.inputs.alias }}"
          mike set-default --push --allow-empty "${{ github.event.inputs.alias }}"
